<!doctype html><html lang="ko"><head><meta charset="utf-8">

<style>
  h2 { position: absolute; left: 88px; top: 180px; font-size: 70px; font-weight: 800; line-height: 1.3; letter-spacing: -0.045em; white-space: nowrap; }
  .fam { position: absolute; left: 0; right: 0; top: 440px; display: flex; justify-content: center; gap: 56px; }
  .av { width: 132px; height: 132px; border-radius: 50%; background: #FFF; position: relative; overflow: hidden; box-shadow: 0 16px 32px rgba(80,50,20,.18); }
  .av::before { content: ''; position: absolute; left: 50%; top: 26px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; background: var(--c); }
  .av::after { content: ''; position: absolute; left: 50%; top: 80px; width: 84px; height: 84px; margin-left: -42px; border-radius: 50%; background: var(--c); }
  .lines { position: absolute; left: 0; top: 572px; }

  .code .lbl { font-size: 28px; font-weight: 700; color: #CC2222; }
  .digits { display: flex; gap: 12px; }

  .cta { position: absolute; left: 88px; right: 88px; top: 880px; height: 370px; border-radius: 48px; background: #FFF; color: #1A1A1A;

  .row { display: flex; align-items: center; gap: 32px; }
  .icon { flex: none; width: 128px; height: 128px; border-radius: 32px; background: #FFF url(../../../../assets/images/icon.png) 50% 36% / 170% no-repeat;
          box-shadow: 0 0 0 3px #EAEAEA; }
  .cta-t { font-size: 44px; font-weight: 800; white-space: nowrap; }
  .search { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 22px 30px; border-radius: 999px; background: #F7F7F7; border: 3px solid #CC2222;
            font-size: 44px; font-weight: 800; white-space: nowrap; }
  .search::before { content: ''; flex: none; width: 26px; height: 26px; border: 6px solid #CC2222; border-radius: 50%; margin-right: 8px; position: relative;
