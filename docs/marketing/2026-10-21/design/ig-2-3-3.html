<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="promo.css">
<style>
  .card { position: absolute; left: 88px; width: 904px; border-radius: 48px; background: #FFF; box-shadow: 0 16px 40px rgba(0,0,0,.07); }
  .card h2 { position: absolute; left: 64px; top: 60px; font-size: 62px; font-weight: 800; line-height: 1.25; letter-spacing: -0.045em; white-space: nowrap; }
  .num { position: absolute; right: 64px; top: 70px; font-size: 32px; font-weight: 800; color: #CC2222; }
  .shot { position: absolute; border-radius: 28px; border: 3px solid #EAEAEA; background: #FFF; box-shadow: 0 16px 32px rgba(0,0,0,.08); }
  .shot .crop { border-radius: 16px; }
  .hot { border: 5px solid #CC2222; box-shadow: 0 0 0 12px rgba(204,34,34,.12), 0 24px 48px rgba(0,0,0,.15); }
</style></head><body>
<div class="bg soft"></div><div class="veil"></div>
<div class="top"><div class="brand"><div class="logo"></div>유통기한 매니저</div><div class="page"><i></i><i></i><i class="on"></i><i></i></div></div>

    <div class="crop" style="--x:44; --y:242; --w:206; --h:64; --s:1.8"><img src="../../../../store-assets/screenshots/06-recipe.jpg"></div>

  </div>
  <svg class="abs" style="left:0; top:0" width="904" height="560"><g fill="none" stroke="#CC2222" stroke-width="6" stroke-linecap="round">
    <path d="M190 342 Q190 440 340 440" stroke-dasharray="2 14"/><path d="M322 420 L346 440 L322 460" stroke-linejoin="round"/></g></svg>
  <div class="shot" style="left:380px; top:350px; padding:12px 10px">
    <div class="crop" style="--x:40; --y:362; --w:290; --h:104; --s:1.5"><img src="../../../../store-assets/screenshots/06-recipe.jpg"></div>
  </div>
</div>

<div class="card" style="top:768px; height:480px">
  <h2><span class="hl">영상으로 레시피 보기</span>도 바로</h2>
  <div class="num">02</div>
  <div class="shot hot" style="left:126px; top:200px; padding:18px 24px">
    <div class="crop" style="--x:40; --y:620; --w:272; --h:50; --s:2.2"><img src="../../../../store-assets/screenshots/06-recipe.jpg"></div>

  </div>
</div>
</body></html>
