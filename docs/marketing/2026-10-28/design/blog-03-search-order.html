<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="promo.css">
<style>
.calc .tag{margin-bottom:24px}
.chips{display:flex;gap:16px;margin-bottom:28px}
.chip{font-size:40px;font-weight:800;padding:14px 34px;border-radius:999px;background:#F7F7F7;border:4px solid #E3E3E3;color:#777}
.chip.on{background:#CC2222;border-color:#CC2222;color:#FFF}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tile{position:relative;height:190px;border-radius:28px;background:#F7F7F7;border:4px solid #E3E3E3;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800}
.tile.on{background:#FFF;border-color:#CC2222}
.badge{position:absolute;right:-14px;top:-14px;min-width:60px;height:60px;border-radius:30px;background:#CC2222;color:#FFF;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 12px}
.sb{height:120px;border-radius:28px;background:#F7F7F7;border:4px solid #CC2222;display:flex;align-items:center;padding:0 36px;font-size:60px;font-weight:800;margin-bottom:28px;box-shadow:0 0 0 10px rgba(204,34,34,.12)}
.sb i{display:block;width:6px;height:64px;background:#1A1A1A;margin-left:6px;border-radius:3px}
.res{display:flex;align-items:center;justify-content:space-between;height:140px;border-bottom:4px solid #EEE;font-size:52px;font-weight:800}
.res:last-child{border:0}
.btn{font-size:40px;font-weight:800;color:#FFF;background:#CC2222;padding:16px 40px;border-radius:999px}
.ln{display:flex;justify-content:space-between;font-size:50px;font-weight:800;height:84px;align-items:center;border-bottom:4px solid #EEE}
.ln:last-child{border:0}
.sheet{background:#F7F7F7;border:4px solid #E3E3E3;border-radius:28px;padding:20px 36px}
.sheet .ln{font-size:44px;height:68px;font-weight:700}
.ar2{text-align:center;font-size:56px;font-weight:800;color:#CC2222;line-height:1;margin:16px 0}
</style></head><body class="cream">
<div class="top"><div class="brand"><div class="logo"></div>유통기한 매니저</div></div>
<h2><span class="hl">진열 순서에 없는 상품은</span><br>검색해서 담아요</h2>
<div class="calc" style="top:430px"><div class="tag" style="font-size:36px">예시 화면 · 실제와 다를 수 있어요</div>
<div class="sb">딸기<i></i></div>
<div class="res"><span>딸기 바</span><span class="btn">담기</span></div>
<div class="res"><span>딸기 콘</span><span class="btn">담기</span></div>
<div class="res"><span>딸기 컵</span><span class="btn">담기</span></div>
</div></body></html>
